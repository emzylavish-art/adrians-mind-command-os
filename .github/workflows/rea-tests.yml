name: REA tests

on:
  push:
    paths:
      - "tools/rea/**"
      - ".github/workflows/rea-tests.yml"
  pull_request:
    paths:
      - "tools/rea/**"
      - ".github/workflows/rea-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run REA unit tests
        run: python -m unittest discover -s tools/rea -p 'test_*.py'
      - name: Smoke-test CLI
        run: python tools/rea/rea.py tools/rea --json > /tmp/rea-report.json
