name: Adrian's Mind production verification
# Candidate CI also runs when audit evidence changes.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/audits/five-way/**"
      - "src/**"
      - "scripts/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dashboard-verify.yml"
  pull_request:
    paths:
      - "docs/audits/five-way/**"
      - "src/**"
      - "scripts/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dashboard-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mind-verification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  migration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rehearsal
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the previous production application for upgrade testing
        uses: actions/checkout@v4
        with:
          ref: 18d5b9364e6bdcfec028eeccf56fe596946ed8ce
          path: previous-production
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      - run: |
          test -n "$REHEARSAL_CONTAINER"
          node scripts/rehearse-postgres.mjs "$REHEARSAL_PORT" previous-production "$REHEARSAL_CONTAINER"
        env:
          REHEARSAL_PORT: ${{ job.services.postgres.ports[5432] }}
          REHEARSAL_CONTAINER: ${{ job.services.postgres.id }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      - run: node scripts/run-tests.mjs --scripts

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      - run: node scripts/run-tests-shard.mjs ${{ matrix.shard }} 4

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      # The production database is not supplied to GitHub CI.
      - run: npm run build

  interface-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      - run: node scripts/audit-interactions.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mind-interface-inventory
          path: out/interface-audit.*
          retention-days: 30

  lint-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      - name: Record ESLint findings
        run: |
          report="$RUNNER_TEMP/mind-lint"
          mkdir -p "$report"
          git rev-parse HEAD > "$report/revision.txt"
          result=0
          npm run lint -- --format json --output-file "$report/eslint.json" || result=$?
          test "$result" -le 1
          test -s "$report/eslint.json"
      - name: Record production baseline diagnostics
        run: |
          baseline=18d5b9364e6bdcfec028eeccf56fe596946ed8ce
          report="$RUNNER_TEMP/mind-lint"
          worktree="$RUNNER_TEMP/mind-lint-base"
          git fetch --no-tags --depth=1 origin "$baseline"
          git worktree add --detach "$worktree" "$baseline"
          cd "$worktree"
          npm ci
          git rev-parse HEAD > "$report/baseline-revision.txt"
          result=0
          npm run lint -- --format json --output-file "$report/baseline-eslint.json" || result=$?
          test "$result" -le 1
          test -s "$report/baseline-eslint.json"
      - uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mind-lint
          if-no-files-found: error
