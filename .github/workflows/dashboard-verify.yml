name: Adrian's Mind dashboard verification

on:
  pull_request:
    paths:
      - "src/components/mind/dashboard-3d/**"
      - "src/components/mind/youtube/**"
      - "src/lib/mind/connectors/**"
      - "src/routes/api/mind/youtube/**"
      - "src/routes/dashboard.tsx"
      - "src/lib/mind/dashboard/**"
      - "src/components/mind/agent-command-center.tsx"
      - "src/components/mind/command-app.tsx"
      - "src/components/mind/ai-provider-connections.tsx"
      - "src/lib/mind/ai-provider-config.server.ts"
      - "src/lib/mind/custom-connection.ts"
      - "src/lib/mind/turn.server.ts"
      - "src/lib/mind/logic-routes.ts"
      - "src/routes/api/mind/**"
      - "src/routeTree.gen.ts"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dashboard-verify.yml"
  push:
    branches:
      - "main"
      - "dashboard/yomaru-graph-polish"
    paths:
      - "src/components/mind/dashboard-3d/**"
      - "src/lib/mind/dashboard/**"
      - "src/components/mind/agent-command-center.tsx"
      - "src/components/mind/command-app.tsx"
      - "src/components/mind/ai-provider-connections.tsx"
      - "src/lib/mind/ai-provider-config.server.ts"
      - "src/lib/mind/custom-connection.ts"
      - "src/lib/mind/turn.server.ts"
      - "src/lib/mind/logic-routes.ts"
      - "src/routes/api/mind/**"
      - "src/routeTree.gen.ts"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dashboard-verify.yml"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
