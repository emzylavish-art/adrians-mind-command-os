name: Publish hosted MCP container

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (for example, latest or a release version)"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
