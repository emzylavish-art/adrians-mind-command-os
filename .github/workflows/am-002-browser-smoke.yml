name: AM-002 isolated browser smoke

on:
  push:
    branches:
      - audit/am-002-playwright
    paths:
      - ".github/workflows/am-002-browser-smoke.yml"
      - "scripts/browser-smoke.mjs"
      - "scripts/browser-smoke-verdict.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: am-002-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-browser-smoke:
    if: github.ref == 'refs/heads/audit/am-002-playwright'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      DATABASE_URL: ""
      XAI_API_KEY: ""
      OPENAI_API_KEY: ""
      VITE_AUTH_ENABLED: "true"
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser smoke guard and verdict tests
        run: node --test scripts/browser-smoke-verdict.test.mjs

      - name: Start local app and capture desktop/mobile smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/am-002-browser-smoke"
          npm run dev > "$RUNNER_TEMP/am-002-dev.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 60); do
            if curl --silent --show-error --fail --output /dev/null http://127.0.0.1:8080/ 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo "Local application did not become ready."
            exit 1
          fi

          node scripts/browser-smoke.mjs \
            http://127.0.0.1:8080/ \
            "$RUNNER_TEMP/am-002-browser-smoke/localhost.png"

      - name: Check TypeScript without modifying app
        run: npm run typecheck

      - name: Upload read-only browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am-002-browser-evidence
          path: ${{ runner.temp }}/am-002-browser-smoke/
          if-no-files-found: warn
          retention-days: 3
