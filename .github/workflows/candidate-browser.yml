name: Candidate isolated browser fixtures
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - name: Run isolated Chromium fixtures
        run: |
          export BROWSER_EXECUTABLE_PATH="$(command -v google-chrome)"
          test -x "$BROWSER_EXECUTABLE_PATH"
          node scripts/visual/run-c3-fixture.mjs
          FIXTURE_SCRIPT=scripts/visual/paired-chat.mjs node scripts/visual/run-c3-fixture.mjs
        env:
          VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/browser-fixtures
      - name: Verify managed browser controls and screenshots
        run: |
          export MIND_BROWSER_FIXTURE_CHROMIUM="$(command -v google-chrome)"
          test -x "$MIND_BROWSER_FIXTURE_CHROMIUM"
          node --test scripts/managed-browser/runtime.test.mjs
          node scripts/managed-browser/app-fixture.mjs
        env:
          VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/browser-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-fixtures-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/browser-fixtures/*.png
            ${{ runner.temp }}/browser-fixtures/*.json
            ${{ runner.temp }}/browser-fixtures/server.log
          if-no-files-found: error
  browser-transitions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - name: Measure historical message parser work
        run: |
          baseline=18d5b9364e6bdcfec028eeccf56fe596946ed8ce
          git fetch --no-tags --depth=1 origin "$baseline"
          mkdir -p "$RUNNER_TEMP/browser-transitions"
          node scripts/profile-c4-render-counts.mjs "$baseline" > "$RUNNER_TEMP/browser-transitions/render-counts.json"
      - name: Run isolated Chromium transitions
        run: |
          export BROWSER_EXECUTABLE_PATH="$(command -v google-chrome)"
          test -x "$BROWSER_EXECUTABLE_PATH"
          node scripts/visual/run-c3-fixture.mjs
        env:
          FIXTURE_SCRIPT: scripts/visual/transition-fixtures.mjs
          VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/browser-transitions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-transitions-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/browser-transitions/*.png
            ${{ runner.temp }}/browser-transitions/*.json
            ${{ runner.temp }}/browser-transitions/server.log
          if-no-files-found: error
  webkit-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps webkit
      - name: Run isolated headless WebKit layouts
        run: node scripts/visual/run-c3-fixture.mjs
        env:
          BROWSER_ENGINE: webkit
          VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/webkit-layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-layout-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/webkit-layout/*.png
            ${{ runner.temp }}/webkit-layout/*.json
            ${{ runner.temp }}/webkit-layout/server.log
          if-no-files-found: error
  browser-zoom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps --no-shell chromium
      - name: Verify 200 percent Chromium page zoom
        run: node scripts/visual/run-c3-fixture.mjs
        env:
          FIXTURE_SCRIPT: scripts/visual/browser-zoom.mjs
          VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/browser-zoom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-zoom-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/browser-zoom
          if-no-files-found: error
